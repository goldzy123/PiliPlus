# mod 的云编译：跟随上游发版自动构建，产出装好 mod 的 APK 并发到本仓库的 release。
#
# 为什么要单独一个 workflow（而不是改上游的 build.yml）：
#   上游的 build.yml 每次同步都会被覆盖，改它等于每次 rebase 都要解冲突。
#   新增文件不冲突 —— 这是 mod 一直遵循的「hook 最小化」策略。
#
# 触发方式：
#   · 手动（Actions 页面 Run workflow）
#   · 每天定时检查上游有没有新 release；有的话先把 mod 分支变基到那个 tag 再构建
#   · 往 mod-* 分支 push
#
# 产出：
#   · <tag>-dev.apk   包名 com.example.piliplus.dev —— 和官方版共存，这是 mod 的主渠道
#   · <tag>.apk       包名 com.example.piliplus     —— 给没装官方版的设备（比如车机）
#
# 注意：fork 上的「定时」工作流默认是关的，需要在 Actions 页面点一次 Enable workflow。

name: mod-release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "release tag（留空则自动生成 mod-<上游tag>-<日期>）"
                required: false
                default: ""
                type: string
            force:
                description: "即使上游没有新版本也强制构建"
                required: false
                default: true
                type: boolean

    schedule:
        # 每天 03:17 UTC（北京时间 11:17）检查一次上游
        - cron: "17 3 * * *"

    push:
        branches:
            - "mod-*"
        paths-ignore:
            - "**.md"
            - "_dsh/**"

concurrency:
    group: mod-release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    # 先决定：要不要构建、基于哪个上游 tag、release 用什么 tag
    prepare:
        runs-on: ubuntu-latest
        outputs:
            build: ${{ steps.decide.outputs.build }}
            base: ${{ steps.decide.outputs.base }}
            tag: ${{ steps.decide.outputs.tag }}
        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}

            - name: 拉上游
              run: |
                  git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git || true
                  git fetch --tags upstream main

            - name: 决定是否需要构建
              id: decide
              run: |
                  set -e
                  # 上游最新的 release tag（拿不到就退回 main）
                  upstream_tag=$(git tag --sort=-creatordate | grep -v '^mod-' | head -1 || true)
                  if [ -z "$upstream_tag" ]; then
                    base=upstream/main
                    upstream_tag=$(git rev-parse --short upstream/main)
                  else
                    base="$upstream_tag"
                  fi
                  base_sha=$(git rev-parse "$base^{commit}")

                  if git merge-base --is-ancestor "$base_sha" HEAD; then
                    up_to_date=true
                  else
                    up_to_date=false
                  fi

                  force='${{ github.event.inputs.force }}'
                  event='${{ github.event_name }}'
                  # 手动 / push 一律构建；定时只在落后时才构建
                  if [ "$event" = "schedule" ] && [ "$up_to_date" = "true" ]; then
                    build=false
                  elif [ "$event" = "workflow_dispatch" ] && [ "$force" != "true" ] && [ "$up_to_date" = "true" ]; then
                    build=false
                  else
                    build=true
                  fi

                  tag='${{ github.event.inputs.tag }}'
                  if [ -z "$tag" ]; then
                    tag="mod-${upstream_tag}-$(date -u +%Y%m%d)"
                  fi

                  echo "上游最新: $upstream_tag ($base_sha)"
                  echo "已包含该基线: $up_to_date"
                  echo "是否构建: $build"
                  echo "release tag: $tag"
                  {
                    echo "build=$build"
                    echo "base=$base"
                    echo "tag=$tag"
                  } >> "$GITHUB_OUTPUT"

    build:
        needs: prepare
        if: needs.prepare.outputs.build == 'true'
        name: 构建 ${{ matrix.suffix }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suffix: dev
                      project_arg: "--android-project-arg=dev"
                    - suffix: release
                      project_arg: ""
        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}

            - name: 配置 git
              run: |
                  git config user.name "mod-bot"
                  git config user.email "mod-bot@users.noreply.github.com"

            - name: 变基到上游最新
              run: |
                  set -e
                  git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git || true
                  git fetch --tags upstream main
                  base='${{ needs.prepare.outputs.base }}'
                  base_sha=$(git rev-parse "$base^{commit}")
                  if git merge-base --is-ancestor "$base_sha" HEAD; then
                    echo "已经在 $base 之上，跳过变基"
                  else
                    echo "变基到 $base"
                    git rebase "$base"
                    # 变基成功才推回去；失败就直接让 job 失败（本地解冲突）
                    git push --force-with-lease origin "HEAD:${{ github.ref_name }}"
                  fi

            - name: 构建 Java 环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装 Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            # 这一步会打 Flutter SDK / material_ui / cupertino_ui 的补丁，
            # PiliPlus 改了不少 Flutter 内部行为，不打补丁根本编译不过。
            - name: 打补丁
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: 解析依赖
              run: flutter pub get

            - name: 构建 APK
              run: |
                  flutter build apk --release \
                    --target-platform android-arm64 \
                    ${{ matrix.project_arg }} \
                    --build-name 2.1.6 \
                    --build-number ${{ github.run_number }}

            - name: 改名
              run: |
                  mkdir -p out
                  cp build/app/outputs/flutter-apk/app-release.apk \
                     "out/PiliPlus-mod-${{ needs.prepare.outputs.tag }}-arm64-${{ matrix.suffix }}.apk"
                  ls -la out/

            - name: 上传构建产物
              uses: actions/upload-artifact@v7
              with:
                  name: apk-${{ matrix.suffix }}
                  path: out/*.apk
                  if-no-files-found: error

    release:
        needs: [prepare, build]
        if: needs.prepare.outputs.build == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: 下载全部 APK
              uses: actions/download-artifact@v6
              with:
                  path: apk
                  merge-multiple: true

            - name: 列出产物
              run: ls -la apk/

            - name: 取上游这一次的更新说明
              id: notes
              run: |
                  body=$(curl -s --max-time 20 \
                    https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases/latest \
                    | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('body','') or '')" \
                    2>/dev/null || true)
                  {
                    echo "body<<EOF"
                    echo "同步上游 \`${{ needs.prepare.outputs.base }}\`。"
                    echo ""
                    echo "**dev 包**（\`com.example.piliplus.dev\`）和官方版共存；**release 包**（\`com.example.piliplus\`）包名与官方版相同，二者只能留一个。"
                    echo ""
                    echo "$body"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: 发布 release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.prepare.outputs.tag }}
                  name: ${{ needs.prepare.outputs.tag }}
                  body: ${{ steps.notes.outputs.body }}
                  files: apk/*.apk
                  make_latest: true
